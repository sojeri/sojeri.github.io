    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: black;
        color: white;
        text-align: center;
        height: 100%;
        width: 100%;
      }
      noscript, main {
        display: flex;
        flex-flow: column nowrap;
        gap: 1rem;

      }
      noscript {
        font-size: 1.3rem;
        height: 100vh;

      }
      main {
        height: 100%;

        overflow-y: auto;
      }
      a {

      }

      a:visited {

        justify-content: center;

      }
      i { /* handling for font awesome logos */        
        padding-right: 0.3rem;
      }
      .summary-links a {
        background: aqua;
        color: black;
        display: block;
        padding: 0.4rem;
        border-radius: 0.5rem;
        text-align: center;
        font-size: 0.8rem;
      }
      .skills {
        display: flex;
        flex-flow: row wrap;
        list-style-type: none;
        align-items: center;
        justify-content: center;
        gap: 0.2rem;
      }
      .skill {
        padding: 0.2rem;
        border: 0.2rem transparent;
        background: #000;
      }
      .XS {
        font-size: 1rem;
      }
      .S {
        font-size: 1.2rem;
      }
      .M {
        font-size: 1.5rem;
      }
      .L {
        font-size: 2rem;
      }
      .XL {
        font-size: 3rem;
      }
      .red {
        color: lightcoral;
      }
      .red-background {
        background: lightcoral;
      }
      .orange {

      }
      .orange-background {
        background: orange;
      }
      .yellow {
        color: gold;
      }
      .yellow-background {
        background: gold;
      }
      .green {
        color: chartreuse;
      }
      .green-background {
        background: chartreuse;
      }
      .blue {
        color: cyan;
      }
      .blue-background {
        background: cyan;
      }
      .indigo {
        color: skyblue;
      }
      .indigo-background {
        background: skyblue;
      }
      .violet {
        color: plum;
      }
      .violet-background {
        background: plum;
      }
      .grey {
        color: lightgray;
      }
      .grey-background {
        background: lightgray;
      }
      .beige {
        color: beige;
      }
      .beige-background {
        background: beige;
      }
      .anothergreen {
        color: mediumspringgreen;
      }
      .anothergreen-background {
        background: mediumspringgreen;
      }
      .anotherblue {
        color: lightcyan;
      }
      .anotherblue-background {
        background: lightcyan;
      }
      .selected {
        border: 0.2rem dotted white;
      }
      .detail-wrappper {
        display: flex;
        justify-content: center;
        width: 100%;
        margin: 0.5rem 0;
      }
      .detail-header {
        display: flex;
        flex-flow: row nowrap;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 0.5rem;
        color: #000;
        text-wrap: balance;
        gap: 0.5rem;
      }
      .clear {
        border: 0;
        align-self: flex-start;
      }
      .detail {
        text-align: center;
        font-size: 1rem;
        max-width: 300px;
        height: auto;
        display: flex;
        flex-flow: column nowrap;
      }
      .detail-list {
        background-color: #ccc;
        color: #000;
        padding: 0.3rem;
        display: flex;
        flex-flow: column nowrap;
        gap: 0.4rem;
        list-style-type: none;
        max-width: 300px;
      }
      .view-as {
        display: flex;
        flex-flow: row nowrap;
        gap: 0.5rem;
        margin: auto;
        justify-content: center;
        align-items: center;
      }
      .view-buttons-wrapper {
        display: flex;
        flex-flow: row nowrap;
        max-width: 400px;
      }
      .view-buttons-wrapper button {
        padding: 0.5rem;
        border: 0;
        cursor: pointer;
        margin: 0.1rem;
      }
      .view-buttons-wrapper button:first-child {
        border-radius: 1rem 0 0 1rem;
      }
      .view-buttons-wrapper button:last-child{
        border-radius: 0 1rem 1rem 0;
      }
      .selected-view {
        font-weight: bold;
        background: coral;
      }
      .table-container {
        max-height: 80vh;
        overflow: scroll;
      }
      table {
        border-collapse: collapse;
        height: 100%;
        width: 100%;
      }
      thead {
        position: sticky;
        top: 0;
        background: black;
        color: aquamarine;
      }
      tr:nth-child(even) {
        background: #122;
      }
      td,th {
        padding: 0.3rem;
      }
      .roles-button {
        background: inherit;
        color: inherit;
        border: 0;
        border-bottom: 0.2rem dotted white;
        width: 300px;
        cursor: pointer;
      }

  <body>
    <noscript>
      <p>I'm sorry, you need to enable JavaScript to view this page.</p>
      <p>It is a React app.</p>
      <p>🐍</p>
      <p><a href="https://sojeri.github.io/">sojeri.github.io</a></p>
    </noscript>
    <script type="text/babel">
      const { useState, useCallback, useEffect } = React;

      /** shuffles an array of skills for better display as a tag cloud */
      const shuffleSkills = (newSkills) => {
        const shuffled = [...newSkills];
        const size = newSkills.length;

        for (let i = 0; i < size * 2; i++) {
          const firstIndex = Math.floor(Math.random() * size);
          const secondIndex = Math.floor(Math.random() * size);
          if (firstIndex !== secondIndex) {
            const first = shuffled[firstIndex];
            shuffled[firstIndex] = shuffled[secondIndex];
            shuffled[secondIndex] = first;
          }
        }
        
        return shuffled;
      }

      /**
       * calculates some high level stats about a collection of skills
       * - min
       * - max
       * - step
       */
      const calculateStats = (skills) => {
        const size = skills.length;
        let min = Number.POSITIVE_INFINITY;
        let max = Number.NEGATIVE_INFINITY;
        
        skills.forEach(skill => {
          const { count } = skill;
          max = count > max ? count : max;
          min = count < min ? count : min;
        })

        const step = Math.floor((max - min) / 5);
        return { min, max, step };
      }

      /**
       * adds additional display props to skills
       * - size
       * - color
       * 
       * & normalizes duration
       */
      const decorateSkills = (rawSkills) => {
        const { min, max, step } = calculateStats(rawSkills);
        const one = min + step;
        const two = one + step;
        const four = max - step;
        const three = four - step;
        const colors = [
          'red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet', 'grey',
          'beige', 'anothergreen', 'anotherblue',
        ];
        let currentColor = 0;
        const skills = rawSkills.map(rawSkill => {
          const skill = { ...rawSkill };

          // round year down because js float math got ugly 😂
          skill.duration = Math.floor(skill.duration);

          //
          // SIZE
          //
          const { count } = skill;
          if (count > four) {
            skill.size = 'XL';
          } else if (count > three) {
            skill.size = 'L';
          } else if (count > two) {
            skill.size = 'M';
          } else if (count > one) {
            skill.size = 'S';
          } else {
            skill.size = 'XS';
          }

          //
          // COLOR
          //
          skill.color = colors[currentColor];
          currentColor += 1;
          currentColor = currentColor < colors.length ? currentColor : 0;

          return skill;
        });

        return skills;
      }


      /** sorts an array of skills for better display as a table */
      const sortSkills = (newSkills) => {
        return newSkills.sort((a, b) => {
          return b.duration - a.duration;
        });
      }

      /** displays a single skill tag in the tag cloud */
      const SkillTag = (props) => {
        const { size, color, value, duration, isSelected, handleClickCb } = props;
        const handleButtonClick = () => {
          handleClickCb(props);
        }

        return (
          <li>
            <button            
              role="radio"
              aria-checked={isSelected}
              className={`skill ${size} ${color} ${isSelected && 'selected'}`}
              onClick={handleButtonClick}
            >{value}</button>
          </li>
        )
      }

      /** represents a single selected skill with more info than displayed in the tag cloud */
      const DetailedSkill = (props) => {
        const { color, roles, value, duration, isSelected, handleClickCb } = props;
        const isYearsPlural = duration !== 1;
        const hasRoles = roles && roles.length > 0;
        const handleClearClick = () => {
          handleClickCb({})
        }
        const handleNestedClearClick = (e) => {
          e.stopPropagation();
          handleClearClick();
        }

        return (
          <div className="detail-wrappper">
            <div className="detail">
              {hasRoles && (
                <>
                  <div className={`detail-header ${color}-background`} onClick={handleClearClick}>
                    <p><strong>{value}</strong> ({duration} year{isYearsPlural && 's'})</p>
                    <button className={`clear ${color}-background`} onClick={handleNestedClearClick}>X</button>
                  </div>
                  <ul className="detail-list">
                    {roles.map(r => (
                      <li key={r}>{r}</li>
                    ))}
                  </ul>
                </>
              )}
            </div>
          </div>
        )
      }

      /**
       * displays skills in an artistic non-deterministic tag-cloud formation
       * (shape changes on every page load)
       */
      const SkillsCloud = (props) => {
        const { skills } = props;
        const [detailedSkill, setDetailedSkill] = useState({});

        const updateDetailed = useCallback((skill) => {
          setDetailedSkill(skill.isSelected ? {} : skill);
        });

        return (
            <div>
              <DetailedSkill {...detailedSkill} handleClickCb={updateDetailed} />
              <ul className="skills">
                {skills.map(s => (
                  <SkillTag
                    key={s.value}
                    {...s}
                    handleClickCb={updateDetailed}
                    isSelected={detailedSkill.value === s.value}
                  />
                ))}
              </ul>
            </div>
        )
      }

      /** displays a single skill row in the table*/
      const SkillRow = (props) => {
        const { value, roles, duration } = props;
        const [showRoles, setShowRoles] = useState(false);

        const toggleRoles = () => {
          setShowRoles(!showRoles)
        }

        return (
          <tr className='skill'>
            <td>{value}</td>
            <td>{duration}</td>
            <td>
              <button className='roles-button' onClick={toggleRoles}>
                View roles
              </button>
              {showRoles && (
                <ul className="detail-list">
                  {roles.map(r => (
                    <li key={r}>{r}</li>
                  ))}
                </ul>
              )}
            </td>
          </tr>
        )
      }

      /**
       * displays skills in a structured table view
       * (not affected by page load)
       */
      const SkillsTable = (props) => {
        const { skills } = props;
        const [sortedSkills, setSortedSkills] = useState([]);
        const [detailedSkill, setDetailedSkill] = useState({});

        useEffect(() => {
          const sorted = sortSkills([...skills]);
          setSortedSkills(sorted);
        }, []);

        const updateDetailed = useCallback((skill) => {
          setDetailedSkill(skill.isSelected ? {} : skill);
        });

        return (
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Skill</th>
                    <th>Years Experience</th>
                    <th>Associated Roles</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedSkills.map(s => (
                    <SkillRow
                      key={s.value}
                      {...s}
                      handleClickCb={updateDetailed}
                      isSelected={detailedSkill.value === s.value}
                    />
                  ))}
                </tbody>
              </table>
            </div>
          )
      }

      /** fetches & displays skills */
      const Skills = () => {
        const [skills, setSkills] = useState([]);
        const isLackingAnySkills = skills.length === 0;
        const [view, setView] = useState('cloud');

        const setSelectedView = useCallback((view) => {
          if (view === 'cloud' || view === 'table') {
            setView(view);
          }
        });
        const setCloud = () => setSelectedView('cloud');
        const setTable = () => setSelectedView('table');

        useEffect(() => {
          fetch('https://sojeri.github.io/better-linkedin-skills/skills.json')
            .then(response => {
              if (response.ok) {
                return response.json();
              }
            })
            .then(data => {
              const decorated = decorateSkills(data);
              const shuffled = shuffleSkills(decorated);
              setSkills(shuffled);
            })
            .catch(e => {
              console.log('alas, I failed to load ye');
              throw e;
            })
        }, []);

        return isLackingAnySkills
          ? (
            <div>Loading skills...</div>
          ) : (
            <>
              <div className='view-as'>
                <div>View skills as:</div>
                <div className='view-buttons-wrapper'>
                  <button
                    onClick={setCloud}
                    role="radio"
                    className={view === 'cloud' && 'selected-view'}
                  >tag cloud</button>
                  <button
                    onClick={setTable}
                    role="radio"
                    className={view === 'table' && 'selected-view'}
                  >structured table</button>
                </div>
              </div>
              {
                view === 'cloud'
                ? <SkillsCloud skills={skills} />
                : <SkillsTable skills={skills} />
              }
            </>
          ) 
      }

      const HeaderLinks = () => (
        <ul class="summary-links">
          <li>
            <a href="https://www.linkedin.com/in/sojeri">
              <i class="fa fa-linkedin" alt=""></i>
              LinkedIn
            </a>
          </li>
          <li>
            <a href="https://sojeri.github.io/better-linkedin-skills">
              <i class="fa fa-linkedin" alt=""></i>
              Better LinkedIn Skills (you are already here)
            </a>
          </li>
          <li>
            <a href="https://github.com/sojeri">
              <i class="fa fa-github" alt=""></i>
              GitHub
            </a>
          </li>
          <li>
            <a href="https://sojeri.github.io">
              <i class="fa fa-desktop" alt=""></i>
              Landing Page
            </a>
          </li>
          <li>
            <a href="https://sojeri.github.io/developer-story">
              <i class="fa fa-stack-overflow" alt=""></i>
              Developer Story
            </a>
          </li>
        </ul>
      )

      const BetterLinkedInSkills = () => {
        return (
          <main>
            <h1>🐍 Jeri Sommers | Better LinkedIn Skills</h1>
            <HeaderLinks />
            <div aria-live='polite'>
              <Skills />
            </div>
          </main>
        );
      };

      ReactDOM.render(<BetterLinkedInSkills />, document.getElementById("root"));
    </script>
    <div id="root"></div>
  </body>
</html>
