      .detail-wrappper {

  <body>
    <noscript className="flex-gap-one column">
      <p>I'm sorry, you need to enable JavaScript to view this page.</p>
      <p>It is a React app.</p>
      <p>🐍</p>
      <p><a href="https://sojeri.github.io/">sojeri.github.io</a></p>
    </noscript>
    <script type="text/babel">
      const { useCallback, useEffect, useMemo, useState } = React;

      /** displays a single skill tag in the tag cloud */
      const SkillTag = (props) => {
        const {
          size, color, value, duration, isSelected,
          handleClickCb, additionalClassNames = '',
      } = props;
        const handleButtonClick = () => {
          handleClickCb(props);
        }

        return (
          <li>
            <button            
              role="radio"
              aria-checked={isSelected}
              className={`skill ${size} ${color} ${isSelected && 'selected'} ${additionalClassNames}`}
              onClick={handleButtonClick}
            >{value}</button>
          </li>
        )
      }

      /** represents a single selected skill with more info than is displayed in the tag cloud */
      const DetailedSkill = (props) => {
        const { color, roles, value, duration, isSelected, handleClickCb, rolesMetadata } = props;
        const isYearsPlural = duration !== 1;
        const hasRoles = roles && roles.length > 0;
        const handleClearClick = () => {
          handleClickCb({})
        }
        const handleNestedClearClick = (e) => {
          e.stopPropagation();
          handleClearClick();
        }

        return (
          <div className="detail-wrappper">
            <div className="detail column">
              {hasRoles && (
                <>
                  <div className={`detail-header row ${color}-background`} onClick={handleClearClick}>
                    <p><strong>{value}</strong> ({duration} year{isYearsPlural && 's'})</p>
                    <button className={`clear ${color}-background`} onClick={handleNestedClearClick}>X</button>
                  </div>
                  <ul className="detail-list column">
                    {roles.map(r => (
                      <li key={r}>
                        {`${rolesMetadata[r].title} (${rolesMetadata[r].company})`}
                      </li>
                    ))}
                  </ul>
                </>
              )}
            </div>
          </div>
        )
      }

      /**
       * displays skills in an artistic non-deterministic tag-cloud formation
       * (shape changes on every page load)
       */
      const SkillsCloud = (props) => {
        const { skills, roles: rolesMetadata } = props;
        const [detailedSkill, setDetailedSkill] = useState({});

        const updateDetailed = useCallback((skill) => {
          setDetailedSkill(skill.isSelected ? {} : skill);
        });

        return (
            <div>
              <DetailedSkill
                {...detailedSkill}
                handleClickCb={updateDetailed}
                rolesMetadata={rolesMetadata}
              />
              <ul className="skills row-wrap">
                {skills.map(s => (
                  <SkillTag
                    key={s.value}
                    {...s}
                    handleClickCb={updateDetailed}
                    isSelected={detailedSkill.value === s.value}
                  />
                ))}
              </ul>
            </div>
        )
      }

      /** displays a single skill row in the table*/
      const SkillRow = (props) => {
        const { value, roles, duration, rolesMetadata } = props;

        return (
          <tr className='skill'>
            <td>{value}</td>
            <td>{duration === 0 ? 'a few months' : duration}</td>
            <td className='roles-wrapper'>
              <details className='restricted-width-small'>
                <summary className='roles-button '>View roles</summary>
                <ul className="detail-list column">
                  {roles.map(r => (
                    <li key={r}>
                      {`${rolesMetadata[r].title} (${rolesMetadata[r].company})`}
                    </li>
                  ))}
                </ul>
              </details>
            </td>
          </tr>
        )
      }

      // SkillsTable constants
      const YEARS_ASCENDING = 'years-ascending';
      const YEARS_DESCENDING = 'years-descending';
      const NAME_ASCENDING = 'name-ascending';
      const NAME_DESCENDING = 'name-descending';
      const YEARS_SORT_BUTTON_NAME = 'years';
      const NAME_SORT_BUTTON_NAME = 'name';

      //
      // buncha sorts, mostly relevant to SkillsTable
      //

      const nameSort = (a, b) => { return b.value < a.value };
      const reverseNameSort = (a, b) => { return a.value < b.value };
      const descendingYearSort = (a, b) => { return b.duration - a.duration };
      const ascendingYearSort = (a, b) => { return a.duration - b.duration };

      /** sorts an array of skills for better display as a table */
      const sortSkills = (newSkills) => {
        const initialSort = newSkills.sort(nameSort);
        return initialSort.sort(descendingYearSort);
      }

      const sortByName = (skills) => {
        return skills.sort(nameSort);
      };

      const sortByNameReverse = (skills) => {
        return skills.sort(reverseNameSort);
      };

      const sortMostExperienceFirst = (skills) => {
        const initialSort = sortByName(skills);
        return initialSort.sort(descendingYearSort);
      };

      const sortLeastExperienceFirst = (skills) => {
        const initialSort = sortByName(skills);
        return initialSort.sort(ascendingYearSort);
      };

      /**
       * displays skills in a structured table view
       * (not affected by page load)
       */
      const SkillsTable = (props) => {
        const { skills, roles: rolesMetadata } = props;
        const [sortedSkills, setSortedSkills] = useState([...skills]);
        const [currentSort, setCurrentSort] = useState(YEARS_DESCENDING);
        // const [displayedRoles, setDisplayedRoles] = useState([]);

        const applyCurrentSort = useCallback((skillsToSort = sortedSkills) => {
          let sortingMethod;
          switch (currentSort) {
            case NAME_ASCENDING: {
              sortingMethod = sortByName;
              break;
            }
            case NAME_DESCENDING: {
              sortingMethod = sortByNameReverse;
              break;
            }
            case YEARS_ASCENDING:
              sortingMethod = sortLeastExperienceFirst;
              break;
            case YEARS_DESCENDING: {}
            default: {
              sortingMethod = sortMostExperienceFirst;
            }
          }
          const newlySorted = sortingMethod(skillsToSort);
          setSortedSkills([...newlySorted]);
        });

        useEffect(() => {
          applyCurrentSort();
        }, [currentSort]);

        // useEffect(() => {
        //   const unfilteredSkills = [...skills];
        //   const filteredSkills = filterByRole(unfilteredSkills, displayedRoles);
        //   applyCurrentSort(filteredSkills);
        // }, [displayedRoles]);

        // const filterByRole = useMemo((skillsToFilter, rolesToMatch) => {
        //   if (rolesToMatch.length === 0) return skillsToFilter;

        //   return skillsToFilter.map(skill => {
        //     let includes = false;
        //     const roles = skill.roles;
        //     for (let role of roles) {
        //       if (rolesToMatch.includes(role)) {
        //         includes = true;
        //         break;
        //       }
        //     }
        //     return includes;
        //   });
        // }, [rolesToMatch]);

        const handleButtonClick = (whichButton) => {
          let nextSort;
          switch (whichButton) {
            case YEARS_SORT_BUTTON_NAME: {
              nextSort = currentSort === YEARS_DESCENDING
                ? YEARS_ASCENDING
                : YEARS_DESCENDING;
              break;
            }
            case NAME_SORT_BUTTON_NAME: {
              nextSort = currentSort === NAME_ASCENDING
                ? NAME_DESCENDING
                : NAME_ASCENDING;
              break;
            }
          }

          if (nextSort !== undefined) {
            setCurrentSort(nextSort)
          };
        }
        const onClickYear = () => handleButtonClick(YEARS_SORT_BUTTON_NAME);
        const onClickName = () => handleButtonClick(NAME_SORT_BUTTON_NAME);

        return (
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>
                      <button onClick={onClickName}>
                        {currentSort === NAME_DESCENDING && <i class="fa fa-arrow-down" alt="descending"></i>}
                        {currentSort === NAME_ASCENDING && <i class="fa fa-arrow-up" alt="ascending"></i>}
                        Skill
                      </button>
                    </th>
                    <th>
                      <button onClick={onClickYear}>
                        {currentSort === YEARS_DESCENDING && <i class="fa fa-arrow-down" alt="descending"></i>}
                        {currentSort === YEARS_ASCENDING && <i class="fa fa-arrow-up" alt="ascending"></i>}
                        Years Experience
                      </button>
                    </th>
                    <th>Associated Roles</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedSkills.map(s => (
                    <SkillRow key={s.value} {...s} rolesMetadata={rolesMetadata} />
                  ))}
                </tbody>
              </table>
            </div>
          )
      }

      /**
       * super basic loading view not expected to display for long.
       * the bulk of page load time is in fetching the in-browser react/babel scripts in the first place.
       * fetching skills.json after those are in place is very fast,
       * so this only flashes on the screen for a very short time.
       */
      const LoadingView = () => (
        <div className="margin-one flex-gap-one column">
          <p>
            Loading skills...
          </p>
          <p>
            If you have time to read this, something probably went wrong with fetching the skills data. Maybe check the browser console or network tab for errors?
          </p>
        </div>
      )

      const SkillButton = (props) => {
        const { color, value, size, handleClickCb } = props;
        const getSizeClassName = () => {
          switch (size) {
            case 'XL':
            case 'L':
              return 'larger bold';
            case 'M':
              return 'bold';
            default:
              return ''
          }
        }
        const sizeClassName = getSizeClassName();

        return (
          <li>
            <button
              className={`timeline-skill ${color}-background ${sizeClassName}`}
              onClick={handleClickCb}
            >
              {value}
            </button>
          </li>
        )
      }

      /**
       * reverse chronological display of skills, more like a CV.
       * has role headers above associated skill lists.
       * supports filtering by skill to review only relevant history.
       */
      const Timeline = (props) => {
        const { skills, roles: rawRoles } = props;
        const [selectedSkill, setSelectedSkill] = useState(null);
        const [displayedRoles, setDisplayedRoles] = useState(Object.values(rawRoles));
        const allRoles = Object.values(rawRoles);

        const resetSkillFilter = () => setSelectedSkill(null);

        const handleSkillClick = useCallback((skill) => {
          if (selectedSkill === skill) {
            resetSkillFilter();
          } else {
            setSelectedSkill(skill);
          }
        });

        const rolesDisplayHeader = useMemo(() => {
          if (selectedSkill === null) {
            return `Displaying all roles (${displayedRoles.length})`;
          }

          const roleWord = displayedRoles.length === 1 ? 'role' : 'roles';

          return `Displaying ${roleWord} (${displayedRoles.length}) with skill`;
        }, [selectedSkill, displayedRoles.length]);

        useEffect(() => {
          const roles = [...allRoles].filter(r => {
            if (selectedSkill === null) return true;
            return r.skills.includes(selectedSkill);
          });
          setDisplayedRoles(roles);
        }, [selectedSkill]);

        return (
          <div className="timeline-wrapper column flex-gap-one">
            <h2>
              {rolesDisplayHeader}
              {
                selectedSkill !== null && (
                  <SkillTag
                    {...selectedSkill}
                    size='S'
                    handleClickCb={resetSkillFilter}
                    additionalClassNames="bold"
                  />
                )
              }
            </h2>
            <p className="larger">
              {
                selectedSkill === null
                  ? 'Click on a skill below to filter matching roles'
                  : `Total years of experience: ${selectedSkill.duration}`
              }
            </p>
            <ul className="timeline column flex-gap-half">
              {displayedRoles.map(r => (
                <li className="timeline-role column" key={r.company}>
                  <div className="timeline-role row flex-gap-one">
                    <div className="what">{r.title}</div>
                    <div className="where">{r.company}</div>
                    <div className="when row">
                      <div>{r.from}</div>
                      <div className="spacer">-</div>
                      <div>{r.to}</div>
                    </div>
                  </div>
                  <ul className="timeline-skills row-wrap">
                    {r.skills.map(s => (
                      <SkillButton
                        {...s}
                        handleClickCb={() => {
                          handleSkillClick(s)
                        }}
                      />
                    ))}
                  </ul>
                </li>
              ))}
            </ul>
          </div>
        )
      }

      // BetterLinkedInSkills constants
      const LOADING_VIEW = 'loading';
      const TAG_CLOUD_VIEW = 'cloud';
      const TIMELINE_VIEW = 'timeline';
      const ABOUT_PAGE_VIEW = 'info';
      const STRUCTURED_TABLE_VIEW = 'table';
      const SKILLS_URI = 'https://sojeri.github.io/better-linkedin-skills/data/skills.json';

      //
      // display helper methods
      // used by BetterLinkedInSkills after fetching data
      //

      /** shuffles an array of skills for better display as a tag cloud */
      const shuffleSkills = (newSkills) => {
        const shuffled = [...newSkills];
        const size = newSkills.length;

        for (let i = 0; i < size * 2; i++) {
          const firstIndex = Math.floor(Math.random() * size);
          const secondIndex = Math.floor(Math.random() * size);
          if (firstIndex !== secondIndex) {
            const first = shuffled[firstIndex];
            shuffled[firstIndex] = shuffled[secondIndex];
            shuffled[secondIndex] = first;
          }
        }
        
        return shuffled;
      }

      /**
       * calculates some high level stats about a collection of skills
       * - min
       * - max
       * - step
       */
      const calculateStats = (skills) => {
        const size = skills.length;
        let min = Number.POSITIVE_INFINITY;
        let max = Number.NEGATIVE_INFINITY;
        
        skills.forEach(skill => {
          const { count } = skill;
          max = count > max ? count : max;
          min = count < min ? count : min;
        })

        const step = Math.floor((max - min) / 5);
        return { min, max, step };
      }

      /**
       * adds additional display props to skills
       * - size
       * - color
       * 
       * & normalizes duration
       */
      const decorateSkills = (rawSkills) => {
        const { min, max, step } = calculateStats(rawSkills);
        const one = min + step;
        const two = one + step;
        const four = max - step;
        const three = four - step;
        const colors = [
          'anotherblue',
          'beige', // second color is currently where snake lands
          'grey', // it needs something with better color contrast
          'anothergreen',
          'blue',
          'indigo',
          'green',
          'orange',
          'red',
          'violet',
          'yellow',
        ];
        let currentColor = 0;
        const skills = rawSkills.map(rawSkill => {
          const skill = { ...rawSkill };

          // round year because js float math got ugly 😂
          const shouldRoundUp = (skill.duration % 1) >= 0.5;
          skill.duration = Math.floor(skill.duration);
          if (shouldRoundUp) skill.duration += 1;

          //
          // SIZE
          //
          const { count } = skill;
          if (count > four) {
            skill.size = 'XL';
          } else if (count > three) {
            skill.size = 'L';
          } else if (count > two) {
            skill.size = 'M';
          } else if (count > one) {
            skill.size = 'S';
          } else {
            skill.size = 'XS';
          }

          //
          // COLOR
          //
          skill.color = colors[currentColor];
          currentColor += 1;
          currentColor = currentColor < colors.length ? currentColor : 0;

          return skill;
        });

        return skills;
      }

      /**
       * adds additional display props to roles.
       * for best display results, pass in already-decorated skills.
       */
      const decorateRoles = (rawRoles, decoratedSkills) => {
        const roles = {...rawRoles};

        // inject skills onto roles
        decoratedSkills.forEach(s => {
          s.roles.forEach(r => {
            if (!roles[r].skills) { roles[r].skills = [] };
            roles[r].skills.push(s);
          });
        });

        // randomize order of skills for more interesting display
        const roleKeys = Object.keys(roles);
        roleKeys.forEach(r => {
          const shuffled = shuffleSkills(roles[r].skills);
          roles[r].skills = shuffled;
        });

        return roles;
      }

      /**
       * high level component which fetches the skills data
       * & handles the logic of which view is actually displayed.
       */
      const BetterLinkedInSkills = () => {
        const [skills, setSkills] = useState([]);
        const [roles, setRoles] = useState({});
        const [view, setView] = useState(LOADING_VIEW);

        const setSelectedView = useCallback((view) => {
          setView(view);
        });
        const setCloud = () => setSelectedView(TAG_CLOUD_VIEW);
        const setInfo = () => setSelectedView(ABOUT_PAGE_VIEW);
        const setTable = () => setSelectedView(STRUCTURED_TABLE_VIEW);
        const setTimeline = () => setSelectedView(TIMELINE_VIEW);

        const SkillsView = useMemo(() => {
          switch (view) {
            case TAG_CLOUD_VIEW:
              return SkillsCloud;
            case STRUCTURED_TABLE_VIEW:
              return SkillsTable;
            case ABOUT_PAGE_VIEW:
              return InfoView;
            case TIMELINE_VIEW:
              return Timeline;
            case LoadingView:
            default:
              return LoadingView;
          }
        }, [view]);

        useEffect(() => {
          fetch(SKILLS_URI)
            .then(response => {
              if (response.ok) {
                return response.json();
              }
            })
            .then(data => {
              const { metadata: rawRoles, skills: rawSkills } = data;
              
              const decorated = decorateSkills(rawSkills, roles);
              const shuffled = shuffleSkills(decorated);
              setSkills(shuffled);

              const roles = decorateRoles(rawRoles, decorated);
              setRoles(rawRoles);

              setView(TAG_CLOUD_VIEW);
            })
            .catch(e => {
              console.error('alas, I failed to load ye', {error: e});
              setView(LOADING_VIEW);
            })
        }, []);

        return (
          <>
            <div className='view-as row'>
              <div>View as:</div>
              <div className='view-buttons-wrapper row'>
                <button
                  onClick={setCloud}
                  role="radio"
                  className={view === TAG_CLOUD_VIEW && 'selected-view'}
                >tag cloud</button>
                <button
                  onClick={setTable}
                  role="radio"
                  className={view === STRUCTURED_TABLE_VIEW && 'selected-view'}
                >structured table</button>
                <button
                  onClick={setTimeline}
                  role="radio"
                  className={view === TIMELINE_VIEW && 'selected-view'}
                >timeline</button>
                <button
                  onClick={setInfo}
                  role="radio"
                  className={view === ABOUT_PAGE_VIEW && 'selected-view'}
                >about page</button>
              </div>
            </div>
            <SkillsView skills={skills} roles={roles} />
          </>
        ) 
      }

      /** basic nav with links to learn more about me */
      const HeaderLinks = () => (
        <details>
          <summary>
            Who is Jeri Sommers?
          </summary>
          <div class="details-summary">
            <nav>
              <ul class="summary-links row-wrap">
                <li>
                  <a href="https://www.linkedin.com/in/sojeri">
                    <i class="fa fa-linkedin" alt=""></i>
                    LinkedIn
                  </a>
                </li>
                <li>
                  <a href="https://sojeri.github.io/better-linkedin-skills">
                    <i class="fa fa-linkedin" alt=""></i>
                    Better LinkedIn Skills (you are already here)
                  </a>
                </li>
                <li>
                  <a href="https://github.com/sojeri">
                    <i class="fa fa-github" alt=""></i>
                    GitHub
                  </a>
                </li>
                <li>
                  <a href="https://sojeri.github.io">
                    <i class="fa fa-desktop" alt=""></i>
                    Landing Page
                  </a>
                </li>
                <li>
                  <a href="https://sojeri.github.io/developer-story">
                    <i class="fa fa-stack-overflow" alt=""></i>
                    Developer Story
                  </a>
                </li>
              </ul>
            </nav>
            <p>
              Full stack software engineer with 10+ years building reliable systems in complex, regulated, fast-moving environments (health tech, civic tech, B2B and B2C enterprise experience). Skilled in agile processes, full stack development, and breaking complex and ambiguous product requirements into scalable and reliable technical solutions. Deeply passionate about user experience and building software to improve human lives. Huge fan of clouds.
            </p>
          </div>
        </details>
      )

      /**
       * the about page view which explains why I built this.
       * TODO: replace the abbr with something that actually works on mobile, :facepalm:
       */
      const InfoView = () => (
        <div className="margin-one restricted-width-wrapper">
          <p className="restricted-width">
            I created this page because I don't believe LinkedIn  profiles do a great job of showcasing where someone's true expertise lies. As far as I can tell, the skills feature is primarily for <abbr title="Search Engine Optimization">SEO</abbr>, not for directly highlighting expertise. Even though LinkedIn already has data like how long a person has been in a given role and which skills they list across multiple roles, they don't seem to put effort into visualizing that data. So I built my own skills visualizer here.
          </p>
        </div>
      )

      const PageLayout = () => {
        return (
          <main className="flex-gap-one column">
            <h1>🐍 Better LinkedIn Skills</h1>
            <HeaderLinks />
            <div aria-live='polite'>
              <BetterLinkedInSkills />
            </div>
          </main>
        );
      };

      ReactDOM.render(<PageLayout />, document.getElementById("root"));
    </script>
    <div id="root"></div>
  </body>
</html>
