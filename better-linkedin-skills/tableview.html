<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="🐍 Jeri Sommers" />
    <meta name="description" content="🐍 Jeri Sommers's Better LinkedIn Skills. Senior Software Engineer | Ex-Spotify, Ex-Microsoft | Full stack software engineer with 10+ years building reliable systems in complex, regulated, fast-moving environments (health tech, civic tech, B2B and B2C enterprise experience). Skilled in agile processes, full stack development, and breaking complex and ambiguous product requirements into scalable and reliable technical solutions. Deeply passionate about user experience and building software to improve human lives." />
    <meta property="og:description" content="🐍 Jeri Sommers's Better LinkedIn Skills. Senior Software Engineer | Full stack software engineer with 10+ years building reliable systems in complex, regulated, fast-moving environments (health tech, civic tech, B2B and B2C enterprise experience). Skilled in agile processes, full stack development, and breaking complex and ambiguous product requirements into scalable and reliable technical solutions. Deeply passionate about user experience and building software to improve human lives." />
    <meta property="og:image" content="https://sojeri.github.io/img/sojeri-side-project-cloud-technology-101-static.jpg" />
    <meta property="og:title" content="🐍 Jeri Sommers | Better LinkedIn Skills" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <title>🐍 Jeri Sommers | Better LinkedIn Skills</title>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: black;
        color: white;
        text-align: center;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      noscript, main {
        display: flex;
        flex-flow: column nowrap;
        gap: 1rem;
        justify-content: center;
        font-family: sans-serif;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      noscript {
        font-size: 1.3rem;
        height: 100vh;
        width: 100vw;
      }
      main {
        height: 100%;
        width: 100%;
        overflow-y: auto;
      }
      a {
        text-decoration: none;
        font-weight: bold;
        color: aqua;
      }
      a:hover {
        text-decoration: underline;
      }
      a:visited {
        color: coral;
      }
      .summary-links {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        gap: 0.8rem;
        margin-bottom: 1rem;
        list-style: none;
      }
      i { /* handling for font awesome logos */        
        padding-right: 0.3rem;
      }
      .summary-links a {
        background: aqua;
        color: black;
        display: block;
        padding: 0.4rem;
        border-radius: 0.5rem;
        text-align: center;
        font-size: 0.8rem;
      }
      .table-container {
        max-height: 80vh;
        overflow: scroll;
      }
      table {
        border-collapse: collapse;
        height: 100%;
        width: 100%;
      }
      thead {
        position: sticky;
        top: 0;
        background: black;
        color: aquamarine;
      }
      tr:nth-child(even) {
        background: #122;
      }
      td,th {
        padding: 0.3rem;
      }
      .skill {
        padding: 0.2rem;
        border: 0.2rem transparent;
        background: #000;
      }
      .detail-list {
        background-color: #ccc;
        color: #000;
        max-width: 300px;
        padding: 0.3rem;
        display: flex;
        flex-flow: column nowrap;
        gap: 0.4rem;
        list-style-type: none;
      }
      .roles-button {
        background: inherit;
        color: inherit;
        border: 0;
        border-bottom: 0.2rem dotted white;
        width: 300px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <noscript>
      <p>I'm sorry, you need to enable JavaScript to view this page.</p>
      <p>It is a React app.</p>
      <p>🐍</p>
      <p><a href="https://sojeri.github.io/">sojeri.github.io</a></p>
    </noscript>
    <script type="text/babel">
      const { useState, useCallback, useEffect } = React;

      /** sorts an array of skills for better display as a table */
      const sortSkills = (newSkills) => {
        return newSkills.sort((a, b) => {
          return b.duration - a.duration;
        });
      }

      /** normalizes skill data */
      const normalizeSkills = (rawSkills) => {
        const skills = rawSkills.map(rawSkill => {
          const skill = { ...rawSkill };

          // round year down because js float math got ugly 😂
          skill.duration = Math.floor(skill.duration);

          return skill;
        });

        return skills;
      }

      /** represents a single tag in the tag cloud */
      const Skill = (props) => {
        const { color, value, roles, duration } = props;
        const [showRoles, setShowRoles] = useState(false);

        const toggleRoles = () => {
          setShowRoles(!showRoles)
        }

        return (
          <tr className={`skill ${color}`}>
            <td>{value}</td>
            <td>{duration}</td>
            <td>
              <button className='roles-button' onClick={toggleRoles}>
                View roles
              </button>
              {showRoles && (
                <ul className="detail-list">
                  {roles.map(r => (
                    <li key={r}>{r}</li>
                  ))}
                </ul>
              )}
            </td>
          </tr>
        )
      }

      /** the full list of skills in the tag cloud */
      const Skills = () => {
        const [skills, setSkills] = useState([]);
        const [detailedSkill, setDetailedSkill] = useState({});
        const isLackingAnySkills = skills.length === 0;

        const updateDetailed = useCallback((skill) => {
          setDetailedSkill(skill.isSelected ? {} : skill);
        });

        useEffect(() => {
          fetch('https://sojeri.github.io/better-linkedin-skills/skills.json')
            .then(response => {
              if (response.ok) {
                return response.json();
              }
            })
            .then(data => {
              const decorated = normalizeSkills(data);
              const sorted = sortSkills(decorated);
              setSkills(sorted);
            })
            .catch(e => {
              console.log('alas, I failed to load ye');
              throw e;
            })
        }, []);

        return isLackingAnySkills
          ? (
            <div>Loading skills... (check browser console for errors)</div>
          ) : (
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Skill</th>
                    <th>Years Experience</th>
                    <th>Associated Roles</th>
                  </tr>
                </thead>
                <tbody>
                  {skills.map(s => (
                    <Skill
                      key={s.value}
                      {...s}
                      handleClickCb={updateDetailed}
                      isSelected={detailedSkill.value === s.value}
                    />
                  ))}
                </tbody>
              </table>
            </div>
          ) 
      }

      const BetterLinkedInSkills = () => {
        return (
          <main>
            <h1>🐍 Jeri Sommers | Better LinkedIn Skills</h1>
            <ul class="summary-links">
              <li>
                <a href="https://www.linkedin.com/in/sojeri">
                  <i class="fa fa-linkedin" alt=""></i>
                  LinkedIn
                </a>
              </li>
              <li>
                <a href="https://sojeri.github.io/better-linkedin-skills">
                  <i class="fa fa-linkedin" alt=""></i>
                  Better LinkedIn Skills (you are already here)
                </a>
              </li>
              <li>
                <a href="https://github.com/sojeri">
                  <i class="fa fa-github" alt=""></i>
                  GitHub
                </a>
              </li>
              <li>
                <a href="https://sojeri.github.io">
                  <i class="fa fa-desktop" alt=""></i>
                  Landing Page
                </a>
              </li>
              <li>
                <a href="https://sojeri.github.io/developer-story">
                  <i class="fa fa-stack-overflow" alt=""></i>
                  Developer Story
                </a>
              </li>
            </ul>
            <p>Prefer visual data? <a href="./">Review the same data as a tag cloud here.</a></p>
            <p>Desktop strongly recommended for this view.</p>
            <Skills />
          </main>
        );
      };

      ReactDOM.render(<BetterLinkedInSkills />, document.getElementById("root"));
    </script>
    <div id="root"></div>
  </body>
</html>
